<mat-card class="list-component-container">
  <mat-card-header>
    <mat-card-title>{{ title }}</mat-card-title>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="onAdd()">
        <mat-icon>add</mat-icon> {{ addButtonText }}
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-container">
      <mat-form-field appearance="outline">
        <input
          matInput
          (keyup)="applyFilter($event)"
          [placeholder]="searchPlaceholder"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="table-container mat-elevation-z2">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Dynamic Column Generation -->
          <ng-container *ngFor="let column of displayedColumns">
            <!-- ID Column -->
            <ng-container
              *ngIf="
                column === 'topicId' ||
                column === 'id' ||
                column === 'projectId' ||
                column === 'proposalId'
              "
              [matColumnDef]="column"
            >
              <ng-container *ngIf="idColumnTemplate; else defaultIdColumn">
                <ng-container
                  *ngTemplateOutlet="idColumnTemplate"
                ></ng-container>
              </ng-container>
              <ng-template #defaultIdColumn>
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let item">{{ item[column] }}</td>
              </ng-template>
            </ng-container>

            <!-- Name Column -->
            <ng-container *ngIf="column === 'name'" [matColumnDef]="column">
              <ng-container *ngIf="nameColumnTemplate; else defaultNameColumn">
                <ng-container
                  *ngTemplateOutlet="nameColumnTemplate"
                ></ng-container>
              </ng-container>
              <ng-template #defaultNameColumn>
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let item">{{ item.name }}</td>
              </ng-template>
            </ng-container>

            <!-- Description Column -->
            <ng-container
              *ngIf="column === 'description'"
              [matColumnDef]="column"
            >
              <ng-container
                *ngIf="descriptionColumnTemplate; else defaultDescriptionColumn"
              >
                <ng-container
                  *ngTemplateOutlet="descriptionColumnTemplate"
                ></ng-container>
              </ng-container>
              <ng-template #defaultDescriptionColumn>
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Description
                </th>
                <td
                  mat-cell
                  *matCellDef="let item"
                  [matTooltip]="item.description"
                  [matTooltipDisabled]="
                    !item.description || item.description.length <= 100
                  "
                  matTooltipClass="description-tooltip"
                  matTooltipPosition="above"
                  [matTooltipShowDelay]="300"
                >
                  {{ item.description | truncate : 100 : true }}
                </td>
              </ng-template>
            </ng-container>

            <!-- Actions Column -->
            <ng-container *ngIf="column === 'actions'" [matColumnDef]="column">
              <ng-container
                *ngIf="actionsColumnTemplate; else defaultActionsColumn"
              >
                <ng-container
                  *ngTemplateOutlet="actionsColumnTemplate"
                ></ng-container>
              </ng-container>
              <ng-template #defaultActionsColumn>
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let item">
                  <button
                    mat-icon-button
                    color="primary"
                    (click)="onEdit(item)"
                    matTooltip="Edit item"
                    class="compact-button"
                  >
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    color="warn"
                    (click)="onDelete(item)"
                    matTooltip="Delete item"
                    class="compact-button"
                  >
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </ng-template>
            </ng-container>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              {{ noDataMessage }}
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator
        [pageSizeOptions]="pageSizeOptions"
        [pageSize]="defaultPageSize"
        aria-label="Select page of items"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
