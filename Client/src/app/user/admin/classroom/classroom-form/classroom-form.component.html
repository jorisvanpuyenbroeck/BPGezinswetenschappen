<div class="container mx-auto mt-8 mb-8">
  <div
    *ngIf="isSubmitted && errorMessage"
    class="rounded p-4 mb-4 text-lg bg-red-200 text-red-800 border-2 border-red-300"
  >
    {{ errorMessage }}
  </div>
  <form #classroomForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="m-1 mb-6">
      <label class="block mb-2 text-sm font-medium text-gray-900" for="name"
        >Name</label
      >
      <input
        #name="ngModel"
        [(ngModel)]="classroom.name"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        id="name"
        name="name"
        placeholder="Name"
        required
        type="text"
      />
      <div [hidden]="name.valid || name.pristine" class="text-red-500 mt-2">
        Name is required
      </div>
    </div>
    <div class="m-1 mb-6">
      <label class="block mb-2 text-sm font-medium text-gray-900" for="level"
        >Level</label
      >
      <input
        #level="ngModel"
        [(ngModel)]="classroom.level"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        id="level"
        name="level"
        placeholder="Level"
        type="text"
      />
    </div>
    <div class="flex justify-end">
      <button
        type="submit"
        class="px-4 py-2 rounded-md bg-blue-200 hover:bg-blue-300 text-blue-800 font-medium"
      >
        {{ isAdd ? "Create" : "Save" }} classroom
      </button>
    </div>
  </form>
</div>
