<mat-card class="list-component-container">
  <mat-card-header>
    <mat-card-title>Proposals</mat-card-title>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon> Create Proposal
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="error-message" *ngIf="errorMessage">
      <mat-error>{{ errorMessage }}</mat-error>
    </div>
    <div class="filter-container">
      <mat-form-field appearance="outline">
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Search proposals"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="table-container mat-elevation-z2">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- ID Column -->
          <ng-container matColumnDef="proposalId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let proposal">
              {{ proposal.proposalId }}
            </td>
          </ng-container>

          <!-- Title Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
            <td mat-cell *matCellDef="let proposal">{{ proposal.title }}</td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Description
            </th>
            <td
              mat-cell
              *matCellDef="let proposal"
              [matTooltip]="proposal.description"
              [matTooltipDisabled]="
                !proposal.description || proposal.description.length <= 100
              "
              matTooltipClass="description-tooltip"
              matTooltipPosition="above"
              [matTooltipShowDelay]="300"
            >
              {{ proposal.description | truncate : 100 : true }}
            </td>
          </ng-container>

          <!-- Origin Column -->
          <ng-container matColumnDef="origin">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Origin</th>
            <td mat-cell *matCellDef="let proposal">{{ proposal.origin }}</td>
          </ng-container>

          <!-- Topics Column -->
          <ng-container matColumnDef="topics">
            <th mat-header-cell *matHeaderCellDef>Topics</th>
            <td mat-cell *matCellDef="let proposal">
              <ng-container
                *ngIf="
                  proposal.topics && proposal.topics.length > 0;
                  else noTopics
                "
              >
                <span *ngFor="let topic of proposal.topics; let last = last">
                  {{ topic.name }}<span *ngIf="!last">, </span>
                </span>
              </ng-container>
              <ng-template #noTopics>-</ng-template>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let proposal">
              <button
                mat-icon-button
                color="primary"
                (click)="edit(proposal.proposalId)"
                matTooltip="Edit proposal"
                class="compact-button"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="delete(proposal.proposalId)"
                matTooltip="Delete proposal"
                class="compact-button"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <!-- Row shown when there is no matching data -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">No data matching the filter</td>
          </tr>
        </table>
      </div>
      <!-- Paginator positioned at bottom of table container -->
      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        [pageSize]="10"
        aria-label="Select page of proposals"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
