<mat-card class="list-component-container">
  <mat-card-header>
    <mat-card-title>Users</mat-card-title>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon> Create User
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="error-message" *ngIf="errorMessage">
      <mat-error>{{ errorMessage }}</mat-error>
    </div>
    <div class="filter-container">
      <mat-form-field appearance="outline">
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Search users"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="table-container mat-elevation-z2">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- ID Column -->
          <ng-container matColumnDef="userId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let user">{{ user.userId }}</td>
          </ng-container>

          <!-- Username Column -->
          <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
            <td mat-cell *matCellDef="let user">{{ user.userName }}</td>
          </ng-container>

          <!-- Given Name Column -->
          <ng-container matColumnDef="givenName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Given Name
            </th>
            <td mat-cell *matCellDef="let user">{{ user.givenName }}</td>
          </ng-container>

          <!-- Family Name Column -->
          <ng-container matColumnDef="familyName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Family Name
            </th>
            <td mat-cell *matCellDef="let user">{{ user.familyName }}</td>
          </ng-container>

          <!-- User Level Column -->
          <ng-container matColumnDef="userLevel">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              User Level
            </th>
            <td mat-cell *matCellDef="let user">{{ user.userLevel }}</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button
                mat-icon-button
                color="primary"
                (click)="edit(user.userId ?? 0)"
                matTooltip="Edit user"
                class="compact-button"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="user.userId !== undefined && delete(user.userId)"
                matTooltip="Delete user"
                class="compact-button"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">No data matching the filter</td>
          </tr>
        </table>
      </div>
      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of users"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
