<div class="container mx-auto mt-8 mb-8">
  <app-generic-form
    [title]="isEdit ? 'Edit Presentation Day' : 'Create Presentation Day'"
    [formGroup]="presentationDayForm"
    [isEdit]="isEdit"
    [isSubmitted]="isSubmitted"
    [errorMessage]="errorMessage"
    [fields]="fields"
    [saveButtonText]="isEdit ? 'Update' : 'Create'"
    (formSubmit)="onSubmit($event)"
    (formCancel)="onCancel()"
  >
  </app-generic-form>
</div>
