<mat-card class="list-component-container">
  <mat-card-header>
    <mat-card-title>Presentation Days</mat-card-title>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon> Create Presentation Day
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-container">
      <mat-form-field appearance="outline">
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Search presentation days"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="table-container mat-elevation-z2">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- ID Column -->
          <ng-container matColumnDef="presentationDayId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let presentationday">
              {{ presentationday.presentationDayId }}
            </td>
          </ng-container>

          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
            <td mat-cell *matCellDef="let presentationday">
              {{ presentationday.date | date : "dd/MM/yyyy" }}
            </td>
          </ng-container>

          <!-- Exam Period Column -->
          <ng-container matColumnDef="examPeriod">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Exam Period
            </th>
            <td mat-cell *matCellDef="let presentationday">
              {{ presentationday.examPeriod?.name }}
            </td>
          </ng-container>

          <!-- Year Column -->
          <ng-container matColumnDef="year">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Year</th>
            <td mat-cell *matCellDef="let presentationday">
              {{ presentationday.examPeriod?.year?.label }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let presentationday">
              <button
                mat-icon-button
                color="primary"
                (click)="edit(presentationday.presentationDayId)"
                matTooltip="Edit presentation day"
                class="compact-button"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="delete(presentationday.presentationDayId)"
                matTooltip="Delete presentation day"
                class="compact-button"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">No data matching the filter</td>
          </tr>
        </table>
      </div>
      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of presentation days"
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
