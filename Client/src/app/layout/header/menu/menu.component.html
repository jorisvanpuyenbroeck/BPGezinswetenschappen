<mat-toolbar color="primary" class="main-toolbar">
  <div class="toolbar-container">
    <!-- Logo and Title -->
    <div class="logo-container">
      <a mat-button routerLink="/" class="home-link">
        <!-- <img
          class="logo-image"
          src="https://storage.googleapis.com/smartpatrol_media/logo%20MB%20hat.svg"
          alt="logo"
        /> -->
        <span class="app-title">My bachelor's project</span>
      </a>
    </div>
    <!-- Navigation Menu -->
    <div class="nav-menu-container">
      <!-- Authenticated User Menu -->
      <ng-container *ngIf="isAuthenticated()">
        <div class="user-menu">
          <!-- Menu Toggle Button -->
          <button
            mat-icon-button
            class="menu-toggle-button"
            aria-label="Toggle menu"
            (click)="onToggleSidenav()"
            *ngIf="isAdmin() || isCoach() || isMentor() || isStudent()"
          >
            <mat-icon>menu</mat-icon>
          </button>

          <!-- User Avatar Button -->
          <button mat-icon-button class="user-avatar-button">
            <img
              [src]="user.picture"
              [alt]="user.name"
              class="user-avatar"
              *ngIf="user.picture"
            />
            <mat-icon *ngIf="!user.picture">account_circle</mat-icon>
          </button>
        </div>
      </ng-container>

      <!-- Non-authenticated User Menu -->
      <ng-container *ngIf="!isAuthenticated()">
        <div class="auth-buttons">
          <app-login-button></app-login-button>
          <app-signup-button></app-signup-button>
        </div>
      </ng-container>
    </div>
  </div>
</mat-toolbar>
